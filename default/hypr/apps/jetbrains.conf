# Fix splash screen showing in weird places and prevent annoying focus takeovers
windowrule {
  name = Jetbrains splash
  match:class = ^(jetbrains-.*)$, title:^(splash)$, floating:1
  center = true
  no_focus = true
  border_size = 0
}


windowrule {
  name = Jetbrains popups
  match:class = ^(jetbrains-.*)
  match:title =^()$, floating:1
  center = true
  border_size = 0
  stay_focused = true
  size = >50% >50%
  float= true
  no_initial_focus = true
  no_follow_mouse = true
}
